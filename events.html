<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Events | Happening</title>
  <meta name="description" content="Browse upcoming events, gatherings, hackathons and cultural programs in your city.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/events.css">
</head>

<body data-page="events">
  <header id="site-header"></header>

  <main>
    <div class="container">
      <div class="page-head">
        <h1>Events near you</h1>
        <p class="muted">Search, filter and find something to do this week.</p>
      </div>

      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search events, places or topics" aria-label="Search events">
      </div>

      <div class="filters">
        <select id="city" class="select" aria-label="City"></select>
        <select id="when" class="select" aria-label="Date"></select>
        <div id="price" class="segmented" role="group" aria-label="Price"></div>
      </div>

      <div id="categories" class="chips" role="group" aria-label="Category"></div>

      <p id="count" class="result-count" aria-live="polite"></p>
      <div id="results" class="card-grid"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
