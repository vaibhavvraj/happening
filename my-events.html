<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My events | Happening</title>
  <meta name="description" content="Events you have listed on Happening.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/events.css">
  <link rel="stylesheet" href="css/forms.css">
</head>

<body data-page="my-events">
  <header id="site-header"></header>

  <main class="container">
    <!-- Shown to anyone who is not logged in as an organiser -->
    <div id="gate" class="panel" style="margin-top:32px">
      <h1>Organisers only</h1>
      <p class="muted">Log in as an organiser to see your events.</p>
      <div>
        <a class="btn btn-primary" href="login.html?mode=signup&amp;role=organiser">Sign up / Log in</a>
      </div>
    </div>

    <div id="content" hidden>
      <div class="page-head">
        <h1>My events</h1>
        <p class="muted">Events you have listed. Counts here are saved on this device in the preview.</p>
      </div>

      <p id="published-banner" class="pill pill-free" hidden style="margin-bottom:12px">Your event is published.</p>

      <div id="my-events" class="card-grid"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/components.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/my-events.js"></script>
</body>
</html>
